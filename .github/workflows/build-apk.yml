name: Flutter APK Build

on:
  push:
    branches: [main, step-1-ai-foundation, chat-ai-end-to-end-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.gyarasigujjar57
      - name: Configure Firebase Android package and plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Kotlin Gradle files were not generated")
          s = settings.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
          settings.write_text(s)
          a = app.read_text()
          if 'id("com.google.gms.google-services")' not in a:
              a = a.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          a = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.gyarasigujjar57.zingzone"', a, count=1)
          app.write_text(a)
          # ML Kit's Flutter bridge references all script option classes at runtime.
          # Ship the script artifacts so R8 can resolve them in release builds.
          dep_block = '''\ndependencies {\n    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-korean:16.0.1")\n}\n'''
          if 'text-recognition-devanagari' not in a:
              a += dep_block
          app.write_text(a)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Test deterministic Worker intake engine
        run: node --test worker/test/*.test.js
      - name: Smoke test live Zing Zone AI Worker (Step 1)
        run: |
          set -euo pipefail
          WORKER_URL="https://zing-zone-ai.gyarasigujjar57.workers.dev"
          health="$(curl --silent --show-error --max-time 30 "$WORKER_URL/")"
          echo "Worker health: $health"
          echo "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="online", d'
          code="000"
          for attempt in 1 2 3; do
            code="$(curl --silent --show-error --max-time 90 -o worker-response.json -w "%{http_code}" \
              -H 'Content-Type: application/json' \
              -d '{"language":"hi","messages":[{"role":"user","text":"Mujhe army ka form bharna hai"}]}' \
              "$WORKER_URL/")"
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" != "429" ]; then break; fi
            echo "Gemini rate limit on attempt $attempt; waiting before retry"
            sleep $((attempt * 20))
          done
          echo "Worker POST HTTP status: $code"
          echo "Worker POST response body:"
          cat worker-response.json
          test "$code" = "200"
          python3 -c 'import json; d=json.load(open("worker-response.json")); a=d.get("answer",""); assert d.get("language")=="hi", d; assert isinstance(a,str) and len(a.strip())>=20, d; assert any(x in a.lower() for x in ["किस", "कौन", "भर्ती", "recruitment", "which", "कृपया", "बताइए", "बताएं"]) or "?" in a or "？" in a, "Expected a natural clarifying question for vague army-form request: "+a; print("Live Hindi language-policy reply received:", a[:500])'
      - name: Smoke test live Gemini image understanding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, zlib
          w = h = 64
          raw = b''.join(b'\x00' + bytes([220, 35, 35]) * w for _ in range(h))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>2I5B', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          body = {"messages":[{"role":"user","text":"Describe the main color in this image in one short sentence."}],"image":{"mimeType":"image/png","data":__import__('base64').b64encode(png).decode()}}
          with open('worker-image-request.json','w') as f: json.dump(body,f)
          PY
          code="$(curl --silent --show-error --max-time 90 -o worker-image-response.json -w "%{http_code}" -H 'Content-Type: application/json' --data-binary @worker-image-request.json "https://zing-zone-ai.gyarasigujjar57.workers.dev/")"
          echo "Worker image POST HTTP status: $code"
          cat worker-image-response.json
          test "$code" = "200"
          python3 -c 'import json; d=json.load(open("worker-image-response.json")); a=d.get("answer",""); assert isinstance(a,str) and len(a.strip())>=5, d; print("Live Gemini image response received:", a[:300])'
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            echo "APK build attempt $attempt failed; clearing corrupt NDK download cache and retrying"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/.temp"/* 2>/dev/null || true
            sleep 8
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zing-zone-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
