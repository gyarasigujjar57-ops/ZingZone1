name: Deploy ZingZone Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check required repository secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZINGZONE_78BC8 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_ZINGZONE_78BC8 in GitHub Actions secrets. Do not commit a service-account JSON file."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in GitHub Actions secrets. Never place the Gemini key in Flutter/client code."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZINGZONE_78BC8 }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install and build Functions
        working-directory: functions
        run: |
          npm install
          npm run build

      - name: Store Gemini API key as a Firebase secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | firebase functions:secrets:set GEMINI_API_KEY --project zingzone-78bc8 --force

      - name: Deploy callable AI function
        run: firebase deploy --only functions:askZingAI --project zingzone-78bc8
