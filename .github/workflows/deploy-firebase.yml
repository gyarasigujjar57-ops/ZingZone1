name: Deploy Zing Zone Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Configure Gemini API secret in Firebase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing GitHub Actions secret GEMINI_API_KEY"
            exit 1
          fi
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/zing-gemini-key"
          firebase functions:secrets:set GEMINI_API_KEY --data-file "$RUNNER_TEMP/zing-gemini-key" --project zingzone-78bc8 --force
          rm -f "$RUNNER_TEMP/zing-gemini-key"

      - name: Build and deploy Firebase Functions
        run: |
          cd functions
          npm ci
          npm run build
          cd ..
          firebase deploy --only functions --project zingzone-78bc8 --non-interactive
