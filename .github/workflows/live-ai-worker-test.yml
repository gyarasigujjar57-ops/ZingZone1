name: Live AI Worker Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-form-chat-panel
    paths:
      - ".github/workflows/live-ai-worker-test.yml"
      - "worker/src/index.js"

jobs:
  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Worker health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://zing-zone-ai.gyarasigujjar57.workers.dev" \
            -o health.json
          cat health.json
          echo
      - name: Verify live Gemini reply through Worker
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 45 \
            -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"messages":[{"role":"user","text":"Reply with exactly: ZING_LIVE_OK"}]}' \
            "https://zing-zone-ai.gyarasigujjar57.workers.dev")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "Worker request failed. Sanitized response:"
            jq '{error, upstream_status, diagnostic}' response.json 2>/dev/null || echo "No JSON error body"
            exit 1
          fi
          answer=$(jq -r '.answer // empty' response.json)
          if [ -z "$answer" ]; then
            echo "Worker returned HTTP 200 but no answer field."
            jq '{error, message}' response.json
            exit 1
          fi
          echo "AI reply received successfully:"
          echo "$answer"
          if ! printf '%s' "$answer" | grep -q 'ZING_LIVE_OK'; then
            echo "The response arrived but did not contain the expected test text."
            exit 1
          fi
          echo "PASS: Cloudflare Worker reached Gemini and returned an answer."
      - name: Verify actual image OCR through Worker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, struct, zlib
          text = "ZING_IMAGE_PROOF_8271"
          font = {
              "Z":["11111","00001","00010","00100","01000","10000","11111"],
              "I":["11111","00100","00100","00100","00100","00100","11111"],
              "N":["10001","11001","10101","10011","10001","10001","10001"],
              "G":["01110","10001","10000","10111","10001","10001","01110"],
              "_":["00000","00000","00000","00000","00000","00000","11111"],
              "M":["10001","11011","10101","10101","10001","10001","10001"],
              "A":["01110","10001","10001","11111","10001","10001","10001"],
              "E":["11111","10000","10000","11110","10000","10000","11111"],
              "P":["11110","10001","10001","11110","10000","10000","10000"],
              "R":["11110","10001","10001","11110","10100","10010","10001"],
              "O":["01110","10001","10001","10001","10001","10001","01110"],
              "F":["11111","10000","10000","11110","10000","10000","10000"],
              "8":["01110","10001","10001","01110","10001","10001","01110"],
              "2":["01110","10001","00001","00010","00100","01000","11111"],
              "7":["11111","00001","00010","00100","01000","01000","01000"],
              "1":["00100","01100","00100","00100","00100","00100","01110"]
          }
          scale, margin = 8, 12
          logical_w = len(text) * 6
          logical_h = 7
          width = logical_w * scale + margin * 2
          height = logical_h * scale + margin * 2
          bitmap = [[255 for _ in range(width)] for _ in range(height)]
          for i, ch in enumerate(text):
              for y, row in enumerate(font[ch]):
                  for x, bit in enumerate(row):
                      if bit == "1":
                          for sy in range(scale):
                              for sx in range(scale):
                                  bitmap[margin + y*scale + sy][margin + (i*6+x)*scale + sx] = 0
          raw = b"".join(b"\x00" + bytes(v for p in row for v in (p,p,p)) for row in bitmap)
          def chunk(kind, data):
              return struct.pack(">I",len(data)) + kind + data + struct.pack(">I",zlib.crc32(kind+data)&0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n" +
                 chunk(b"IHDR",struct.pack(">IIBBBBB",width,height,8,2,0,0,0)) +
                 chunk(b"IDAT",zlib.compress(raw,9)) +
                 chunk(b"IEND",b""))
          image = base64.b64encode(png).decode()
          assert base64.b64decode(image,validate=True) == png
          payload = {
              "messages": [{
                  "role": "user",
                  "text": "Read the exact uppercase code printed in the attached image. Reply with only the code, no explanation."
              }],
              "image": {"mimeType":"image/png","data":image}
          }
          with open("image-request.json","w") as f:
              json.dump(payload,f)
          PY
          code=$(curl --silent --show-error --max-time 50 \
            -o image-response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data-binary @image-request.json \
            "https://zing-zone-ai.gyarasigujjar57.workers.dev")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            jq '{error, upstream_status, diagnostic}' image-response.json 2>/dev/null || cat image-response.json
            exit 1
          fi
          answer=$(jq -r '.answer // empty' image-response.json | tr -d '\r\n `')
          if ! printf '%s' "$answer" | grep -Fq 'ZING_IMAGE_PROOF_8271'; then
            echo "Image OCR did not return the exact text from the test image."
            jq '{answer,error}' image-response.json
            exit 1
          fi
          echo "PASS: Gemini read the actual text contained in the uploaded image."
      - name: Verify deterministic form field comparison and official-site guard
        run: |
          set -euo pipefail
          base="https://zing-zone-ai.gyarasigujjar57.workers.dev"
          curl --silent --show-error --fail --max-time 20 -o verify-match.json \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","text":"Run the supplied deterministic form verification."}],"formVerification":{"fields":[{"label":"Full name","sourceValue":"TEST PERSON","actualValue":"TEST PERSON"},{"label":"State","sourceValue":"Rajasthan","actualValue":"Rajasthan"}]}}' "$base"
          python3 - <<'PY'
          import json
          data=json.load(open("verify-match.json"))
          assert data.get("passed") is True, data
          assert all(x.get("status") == "MATCH" for x in data["checks"]), data
          print("PASS: exact source values match.")
          PY
          code=$(curl --silent --show-error --max-time 20 -o verify-mismatch.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","text":"Run the supplied deterministic form verification."}],"formVerification":{"fields":[{"label":"Date of birth","sourceValue":"2001-01-01","actualValue":"2001-10-01"}]}}' "$base")
          test "$code" = "200"
          python3 - <<'PY'
          import json
          data=json.load(open("verify-mismatch.json"))
          assert data.get("passed") is False, data
          assert data.get("requires_review") is True, data
          assert data["checks"][0]["status"] == "MISMATCH", data
          print("PASS: mismatched values are blocked for review.")
          PY
          code=$(curl --silent --show-error --max-time 20 -o nonofficial-page.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","text":"Explain page"}],"page":{"url":"https://example.com","title":"test","text":"A page with enough text for testing the guard.","fields":[]}}' "$base")
          test "$code" = "403"
          echo "PASS: non-official domains are rejected by page analysis."
      - name: Verify automatic official-page analysis through Worker
        run: |
          set -euo pipefail
          base="https://zing-zone-ai.gyarasigujjar57.workers.dev"
          code=$(curl --silent --show-error --max-time 45 -o page-response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","text":"Explain this official form page in simple Hindi. Identify the required fields and do not invent values."}],"page":{"url":"https://sample.gov.in/application","title":"Citizen Application","text":"Citizen Application Form. Instructions: Enter your full name as printed on your certificate. Date of birth must match the school certificate. Select your state from the list. Required fields are marked with an asterisk. Test marker: ZING_PAGE_READ_OK.","fields":[{"label":"Full name","name":"full_name","type":"text","required":true},{"label":"Date of birth","name":"dob","type":"date","required":true},{"label":"State","name":"state","type":"select","required":true,"options":["Rajasthan","Haryana"]}]}}' "$base")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            jq '{error, upstream_status, diagnostic}' page-response.json 2>/dev/null || cat page-response.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open("page-response.json"))
          answer=data.get("answer","").strip()
          assert answer, data
          print("PASS: official-page context reached Gemini and produced an analysis.")
          print(answer[:1200])
          PY
      - name: Verify AI form draft values through Worker
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 45 \
            -o form-response.json \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","text":"Return ONLY a JSON object mapping field index strings to values. Do not use Markdown. Allowed fields: index 0 is a Full name text input; index 1 is a State select with exact options Rajasthan and Haryana. User-provided facts: Full name is TEST PERSON; State is Rajasthan. Return exactly {\"0\":\"TEST PERSON\",\"1\":\"Rajasthan\"}."}]}' \
            "https://zing-zone-ai.gyarasigujjar57.workers.dev"
          python3 - <<'PY'
          import json
          response = json.load(open("form-response.json"))
          answer = response.get("answer", "").strip()
          answer = answer.removeprefix("```json").removesuffix("```").strip()
          values = json.loads(answer)
          assert values.get("0") == "TEST PERSON", values
          assert values.get("1") == "Rajasthan", values
          print("PASS: Gemini returned valid draft values for the supplied form schema.")
          PY

# Run this check after each Worker implementation change.

# Re-run against the current Cloudflare deployment after the Worker source update.
